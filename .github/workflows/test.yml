name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MISE_VERSION: v2026.11.2
  # mise asks GitHub's API which version is "latest"; a token avoids its rate
  # limit for anonymous requests.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    # The same Ubuntu release as the workbench image.
    container: ubuntu:26.04
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # git before checkout, so the checkout is a clone that
      # `mise bootstrap --from` can clone in turn.
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates curl emacs-nox git shellcheck tmux zsh
          # The checkout belongs to the runner's user, not the container's root.
          git config --system --add safe.directory '*'

      - uses: actions/checkout@v7

      - name: Install mise
        run: curl -fsSL https://mise.run | MISE_INSTALL_PATH=/usr/local/bin/mise sh

      - name: Check syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n post-install.sh
          shellcheck post-install.sh
          sh -n home/dot-tinted-shell
          for file in home/dot-zshenv home/dot-zprofile home/dot-zshrc \
                      home/dot-zpreztorc home/dot-zlogin home/dot-zlogout; do
            zsh -n "$file"
          done
          git config --file home/dot-gitconfig --list >/dev/null

      - name: Bootstrap a fresh home, twice
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          bootstrap() {
            mise bootstrap --from "$GITHUB_WORKSPACE" --from-dir "$HOME/.dotfiles" \
              --config-dir . --yes
          }
          bootstrap
          # A second run must succeed too: post-install.sh runs every time.
          bootstrap

          test "$HOME/.config/mise" -ef "$HOME/.dotfiles"
          for source in home/dot-*; do
            target="$HOME/.${source#home/dot-}"
            test ! -L "$target"
            cmp "$source" "$target"
          done
          test -s "$HOME/.zprezto/init.zsh"

          export PATH="$HOME/.local/share/mise/shims:$PATH"
          node --version
          atuin --version
          printf '%s\n' '--- a/f' '+++ b/f' '@@ -1 +1 @@' '-old' '+new' | diff-so-fancy >/dev/null

          # The optional environments' configs parse too.
          MISE_ENV=workbench,personal mise ls --missing >/dev/null

      - name: Check Git, Emacs, tmux, Prezto and Atuin
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          export PATH="$HOME/.local/share/mise/shims:$PATH"

          git_config() {
            git config --global --includes --get "$1"
          }
          test "$(git_config gpg.format)" = ssh
          test "$(git_config commit.gpgSign)" = true
          test "$(git_config color.ui)" = auto
          test "$(git_config init.defaultBranch)" = main
          test "$(git_config fetch.prune)" = true
          test "$(git_config merge.conflictStyle)" = zdiff3
          test "$(git_config pull.ff)" = only
          test "$(git_config push.autoSetupRemote)" = true
          test "$(git_config core.pager)" = 'diff-so-fancy | less --tabs=4 -R'
          test "$(git_config user.name)" = 'Paul Frybarger'
          test "$(git_config user.email)" = pfrybar@frymail.net
          test "$(git_config user.signingKey)" = '~/.ssh/git_signing_key'

          # gh supplies GitHub credentials; a stub stands in for it.
          stub_bin="$RUNNER_TEMP/stub-bin"
          mkdir -p "$stub_bin"
          printf '%s\n' '#!/bin/sh' \
            '[ "$*" = "auth git-credential get" ] && printf "username=stub\npassword=from-gh\n"' \
            > "$stub_bin/gh"
          chmod +x "$stub_bin/gh"
          printf 'protocol=https\nhost=github.com\n\n' \
            | PATH="$stub_bin:$PATH" GIT_TERMINAL_PROMPT=0 git credential fill \
            | grep -qx 'password=from-gh'

          # ~/.gitconfig.local is included last, so it overrides tracked values.
          git config --file "$HOME/.gitconfig.local" user.email work@example.com
          test "$(git_config user.email)" = work@example.com

          # post-install.sh installed the selected Emacs packages.
          emacs --batch --quick --eval '(package-initialize)' --load "$HOME/.emacs" \
            --eval "(unless (equal package-selected-packages '(base16-theme markdown-mode yaml-mode)) (kill-emacs 1))" \
            --eval "(unless (memq 'base16-tomorrow-night custom-enabled-themes) (kill-emacs 1))" \
            --eval "(unless (equal custom-file (locate-user-emacs-file \"custom.el\")) (kill-emacs 1))" \
            --eval "(unless (equal (cdr (assoc \".\" backup-directory-alist)) (locate-user-emacs-file \"backups\")) (kill-emacs 1))"

          socket="dotfiles-test-$RANDOM"
          trap 'tmux -L "$socket" kill-server 2>/dev/null || true' EXIT
          tmux -L "$socket" -f "$HOME/.tmux.conf" new-session -d
          test "$(tmux -L "$socket" show-options -gv prefix)" = C-Space
          test "$(tmux -L "$socket" show-options -gv history-limit)" = 100000
          test "$(tmux -L "$socket" show-options -sv escape-time)" = 10
          test "$(tmux -L "$socket" show-options -gv mouse)" = on
          test "$(tmux -L "$socket" show-options -sv extended-keys)" = on
          test "$(tmux -L "$socket" show-options -sv extended-keys-format)" = csi-u
          test "$(tmux -L "$socket" show-options -sv focus-events)" = on
          test "$(tmux -L "$socket" show-options -sv set-clipboard)" = on
          test "$(tmux -L "$socket" show-options -gv allow-passthrough)" = on
          test "$(tmux -L "$socket" show-options -gv renumber-windows)" = on
          grep -Fxq 'xterm*:extkeys' <<< \
            "$(tmux -L "$socket" show-options -sv terminal-features)"
          grep -q 'send-prefix' <<< \
            "$(tmux -L "$socket" list-keys -T prefix C-Space)"

          # Each check exits on failure: zsh -c only reports the last command's
          # status, and errexit ignores negated commands. PATH starts without
          # mise's shims, so the shell files must put mise's tools on it.
          PATH=/usr/local/bin:/usr/bin:/bin ZDOTDIR="$HOME" TERM=xterm-256color zsh -lic '
            for module in environment editor history utility completion syntax-highlighting prompt; do
              zstyle -t ":prezto:module:$module" loaded || exit 1
            done
            [[ $options[CORRECT] == off && $options[CORRECT_ALL] == off ]] || exit 1
            [[ $prompt_theme == pure ]] || exit 1
            [[ $PURE_GIT_UNTRACKED_DIRTY == 0 ]] || exit 1
            zstyle -t :prezto:module:python loaded && exit 1
            (( $+functions[_atuin_search] )) || exit 1
            [[ $MISE_SHELL == zsh ]] || exit 1
            (( $+commands[atuin] && $+commands[diff-so-fancy] )) || exit 1
          '

  macos:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Check the Brewfile
        run: brew bundle list --file=Brewfile --formula >/dev/null

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap a fresh home
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          mise bootstrap --from "$GITHUB_WORKSPACE" --from-dir "$HOME/.dotfiles" \
            --config-dir . --yes

          for source in home/dot-*; do
            target="$HOME/.${source#home/dot-}"
            test ! -L "$target"
            cmp "$source" "$target"
          done
          test -s "$HOME/.zprezto/init.zsh"
          "$HOME/.local/share/mise/shims/atuin" --version

          # zprofile sets Homebrew's environment without running brew.
          ZDOTDIR="$HOME" /bin/zsh -dfc '
            source "$ZDOTDIR/.zprofile"
            [[ $HOMEBREW_PREFIX == /opt/homebrew ]] || exit 1
            [[ $HOMEBREW_CELLAR == /opt/homebrew/Cellar ]] || exit 1
            [[ $HOMEBREW_REPOSITORY == /opt/homebrew ]] || exit 1
            (( path[(Ie)/opt/homebrew/bin] )) || exit 1
            (( fpath[(Ie)/opt/homebrew/share/zsh/site-functions] )) || exit 1
            [[ $INFOPATH == /opt/homebrew/share/info:* ]] || exit 1
            (( path[(Ie)$HOME/.local/share/mise/shims] )) || exit 1
          '

          # A login shell finds mise's tools and activates mise.
          ZDOTDIR="$HOME" TERM=xterm-256color zsh -lic '
            [[ $MISE_SHELL == zsh ]] || exit 1
            (( $+commands[atuin] && $+commands[diff-so-fancy] )) || exit 1
          '
